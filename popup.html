<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- ============ HEADER ============ -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 40 40" width="36" height="36" aria-hidden="true">
          <rect width="40" height="40" rx="10" fill="var(--accent)"/>
          <path d="M12 8h12l6 6v18H12z" fill="#fff"/>
          <path d="M24 8l6 6h-6z" fill="#BEE2DD"/>
          <rect x="12" y="14" width="2.4" height="7" rx="1" fill="#E0A21A"/>
          <rect x="16" y="20" width="10" height="2" rx="1" fill="var(--accent)"/>
          <rect x="16" y="25" width="10" height="2" rx="1" fill="var(--accent)"/>
          <rect x="16" y="30" width="6" height="2" rx="1" fill="var(--accent)"/>
        </svg>
        <div class="brand-text">
          <h1>QuickNote</h1>
          <p>Capture ideas instantly</p>
        </div>
      </div>

      <button id="themeToggle" class="icon-btn icon-btn-lg" type="button"
              title="Switch to dark mode" aria-label="Switch to dark mode" aria-pressed="false">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </header>

    <main class="views">

      <!-- ============ LIST VIEW ============ -->
      <section id="listView" class="view" aria-label="Your notes">
        <div class="search-wrap">
          <label for="searchInput" class="visually-hidden">Search notes</label>
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
          </svg>
          <input id="searchInput" type="search" placeholder="Search notes..." autocomplete="off">
        </div>

        <p id="noteCount" class="note-count" aria-live="polite"></p>

        <div class="list-scroll">
          <ul id="notesList" class="notes-list"></ul>

          <!-- Shown when a search matches nothing -->
          <div id="noResults" class="message-block" hidden>
            <p class="message-title">No notes found</p>
            <p class="message-text">Try a different word, or clear the search box.</p>
          </div>

          <!-- Shown when there are no notes at all -->
          <div id="emptyState" class="empty-state" hidden>
            <svg viewBox="0 0 120 100" width="120" height="100" aria-hidden="true">
              <rect x="30" y="14" width="62" height="74" rx="8" fill="var(--accent-soft)" transform="rotate(-8 61 51)"/>
              <rect x="30" y="12" width="62" height="74" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2" transform="rotate(5 61 49)"/>
              <rect x="40" y="26" width="5" height="16" rx="2" fill="#E0A21A" transform="rotate(5 61 49)"/>
              <rect x="50" y="34" width="32" height="4" rx="2" fill="var(--accent)" transform="rotate(5 61 49)"/>
              <rect x="50" y="45" width="32" height="4" rx="2" fill="var(--border)" transform="rotate(5 61 49)"/>
              <rect x="50" y="56" width="20" height="4" rx="2" fill="var(--border)" transform="rotate(5 61 49)"/>
            </svg>
            <h2>No notes yet</h2>
            <p>Create your first note and keep your ideas organized.</p>
            <button id="emptyCreateBtn" class="btn btn-primary" type="button">+ Create Note</button>
          </div>
        </div>

        <div id="listFooter" class="list-footer">
          <button id="newNoteBtn" class="btn btn-primary btn-block" type="button">+ New Note</button>
        </div>
      </section>

      <!-- ============ EDITOR VIEW ============ -->
      <section id="editorView" class="view editor" aria-labelledby="editorHeading" hidden>
        <h2 id="editorHeading" class="editor-heading">New note</h2>

        <div class="field">
          <label for="noteTitle">Title</label>
          <input id="noteTitle" type="text" placeholder="Note title" maxlength="100" autocomplete="off">
        </div>

        <div class="field field-grow">
          <label for="noteContent">Note</label>
          <textarea id="noteContent" placeholder="Write your note here..."></textarea>
        </div>

        <div class="editor-meta">
          <span id="saveStatus" class="save-status" data-state="idle" role="status">Changes save automatically</span>
          <span id="charCount" class="char-count">0 characters</span>
        </div>

        <div class="editor-actions">
          <button id="saveNoteBtn" class="btn btn-primary" type="button" title="Save note (Ctrl+Enter)">Save Note</button>
          <button id="cancelBtn" class="btn btn-ghost" type="button" title="Close without more changes (Esc)">Cancel</button>
        </div>
      </section>
    </main>

    <!-- Toast notification -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Delete confirmation dialog -->
    <div id="confirmDialog" class="dialog-backdrop" hidden>
      <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
        <h2 id="confirmTitle">Delete this note?</h2>
        <p id="confirmText"></p>
        <div class="dialog-actions">
          <button id="confirmCancelBtn" class="btn btn-ghost" type="button">Cancel</button>
          <button id="confirmDeleteBtn" class="btn btn-danger" type="button">Delete</button>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
